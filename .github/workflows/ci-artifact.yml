name: CI — Test and upload hello.py

on:
  push:
    branches: [ main ]

jobs:
  test-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests (with PYTHONPATH)
        # ensure the project root (github workspace) is on PYTHONPATH for this step
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # show files for debugging (optional)
          echo "Listing repo root:"
          ls -la "$GITHUB_WORKSPACE"
          echo "Listing tests folder:"
          ls -la "$GITHUB_WORKSPACE/tests" || true

          # Run pytest (PYTHONPATH provided via env above)
          pytest -q

      - name: Upload hello.py as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hello-py
          path: hello.py

